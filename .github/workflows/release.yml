name: Desktop builds

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bin: target/release/gachahub
          - os: windows-latest
            bin: target/release/gachahub.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p gachahub
      - uses: actions/upload-artifact@v4
        with:
          name: gachahub-${{ matrix.os }}
          path: ${{ matrix.bin }}
