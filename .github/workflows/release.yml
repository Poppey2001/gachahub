name: Release

# Builds the Windows EXE and the Linux install package and publishes them.
#  - Every push to main                        -> automatic pre-release (vX.Y.Z-pre.N)
#  - Run manually with "version" (e.g. v0.16.0) -> stable release with that tag
#  - Push a tag like v0.16.0                    -> stable release
# GachaHub's built-in updater reads these releases (stable or pre-release channel).
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "assets/game-assets/**"]
  workflow_dispatch:
    inputs:
      version:
        description: "Stable release version / tag to create, e.g. v0.16.0 (empty = pre-release)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  meta:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_VERSION:-}" ]]; then
            TAG="$INPUT_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            # Pre-release: version from Cargo.toml; once that version is released,
            # continue with the next patch so pre-releases always sort as newer.
            BASE=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
            if gh release view "v$BASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              IFS=. read -r MA MI PA <<< "$BASE"
              BASE="$MA.$MI.$((PA + 1))"
            fi
            TAG="v$BASE-pre.$GITHUB_RUN_NUMBER"
          fi
          [[ "$TAG" == v* ]] || TAG="v$TAG"
          VERSION="${TAG#v}"
          if [[ "$VERSION" == *-* ]]; then PRE=true; else PRE=false; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "Building $TAG (prerelease=$PRE)"

  windows:
    name: Windows (EXE)
    needs: meta
    runs-on: windows-latest
    env:
      GACHAHUB_VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked -p gachahub
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/gachahub-windows-x64 | Out-Null
          Copy-Item target/release/gachahub.exe dist/gachahub.exe
          Copy-Item target/release/gachahub.exe dist/gachahub-windows-x64/
          Copy-Item README.md, CHANGELOG.md dist/gachahub-windows-x64/
          Compress-Archive -Path dist/gachahub-windows-x64/* -DestinationPath dist/gachahub-windows-x64.zip
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$env:GACHAHUB_VERSION" packaging/windows/gachahub.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
      - name: Test installer (silent install + uninstall)
        shell: pwsh
        run: |
          $p = Start-Process dist/gachahub-setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          $dir = "$env:LOCALAPPDATA\Programs\GachaHub"
          if (-not (Test-Path "$dir\gachahub.exe")) { throw "gachahub.exe was not installed" }
          $lnk = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter "GachaHub.lnk"
          if (-not $lnk) { throw "start menu shortcut missing" }
          # upgrade over a running GachaHub: setup must stop it and replace the exe
          $app = Start-Process "$dir\gachahub.exe" -PassThru
          Start-Sleep -Seconds 3
          $p = Start-Process dist/gachahub-setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "upgrade over running app: installer exit code $($p.ExitCode)" }
          if (-not (Test-Path "$dir\gachahub.exe")) { throw "upgrade removed gachahub.exe" }
          if ((Get-FileHash "$dir\gachahub.exe").Hash -ne (Get-FileHash dist/gachahub.exe).Hash) { throw "upgrade did not replace gachahub.exe" }
          Get-Process gachahub -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 1
          $u = Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          # the uninstaller re-launches itself from %TEMP%, so poll for completion
          for ($i = 0; $i -lt 30 -and (Test-Path "$dir\gachahub.exe"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$dir\gachahub.exe") { throw "uninstaller left gachahub.exe behind" }
          Write-Host "Installer test passed"
      - uses: actions/upload-artifact@v4
        with:
          name: gachahub-windows
          path: |
            dist/gachahub.exe
            dist/gachahub-setup.exe
            dist/gachahub-windows-x64.zip

  linux:
    name: Linux (install package)
    needs: meta
    # Older Ubuntu = older glibc, so the binary also runs on older distributions.
    runs-on: ubuntu-22.04
    env:
      GACHAHUB_VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked -p gachahub
      - name: Package
        run: |
          PKG=dist/gachahub-linux-x86_64
          mkdir -p "$PKG"
          install -m755 target/release/gachahub "$PKG/gachahub"
          install -m644 assets/branding/gachahub-icon.png "$PKG/gachahub.png"
          install -m644 packaging/linux/gachahub.desktop "$PKG/"
          install -m755 packaging/linux/install.sh packaging/linux/uninstall.sh "$PKG/"
          install -m644 README.md CHANGELOG.md "$PKG/"
          tar -C dist -czf dist/gachahub-linux-x86_64.tar.gz gachahub-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: gachahub-linux
          path: dist/gachahub-linux-x86_64.tar.gz

  publish:
    name: Publish GitHub Release
    needs: [meta, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: GachaHub ${{ needs.meta.outputs.tag }}
          prerelease: ${{ needs.meta.outputs.prerelease }}
          make_latest: ${{ needs.meta.outputs.prerelease == 'false' }}
          generate_release_notes: true
          files: |
            dist/gachahub-setup.exe
            dist/gachahub.exe
            dist/gachahub-windows-x64.zip
            dist/gachahub-linux-x86_64.tar.gz
          body: |
            ## Download

            **Windows:** `gachahub-setup.exe` herunterladen und ausführen – installiert GachaHub mit
            Startmenü-Eintrag (keine Adminrechte nötig, deinstallierbar über „Apps & Features“).
            Portabel ohne Installation: `gachahub.exe`.

            **Linux:** im Terminal

            ```bash
            curl -fsSL https://raw.githubusercontent.com/Poppey2001/gachahub/main/packaging/linux/get.sh | bash
            ```

            oder `gachahub-linux-x86_64.tar.gz` entpacken und `./install.sh` ausführen.

            Bereits installiert? GachaHub aktualisiert sich selbst (Einstellungen → Allgemein → GachaHub).

  cleanup:
    name: Remove old pre-releases
    needs: [meta, publish]
    if: needs.meta.outputs.prerelease == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Keep the 5 newest pre-releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease)] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
          while read -r tag; do
            echo "Deleting old pre-release $tag"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done
