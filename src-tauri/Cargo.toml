[package]
name = "gachahub"
version = "0.7.0"
description = "Cross-platform gacha game launcher"
authors = ["GachaHub contributors"]
edition = "2021"

[lib]
name = "gachahub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"

zip = "2"
