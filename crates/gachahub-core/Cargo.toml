[package]
name = "gachahub-core"
description = "GachaHub launcher core: game providers, downloads, runners, mods, XXMI and settings"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
zip = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots"] }
tokio = { version = "1", features = ["fs", "io-util", "time", "sync", "rt", "rt-multi-thread", "macros"] }
futures = "0.3"
md5 = "0.7"
sha2 = "0.10"
tar = "0.4"
flate2 = "1"
xz2 = "0.1"
zstd = "0.13"
directories = "6"
pelite = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "ico", "bmp"] }
semver = "1"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
