[workspace]
resolver = "2"
members = ["crates/gachahub-core", "crates/gachahub-app"]

[workspace.package]
version = "0.17.0"
edition = "2021"
license = "MIT"
authors = ["GachaHub contributors"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev.package."*"]
opt-level = 2
